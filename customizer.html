<div class="section-box">
                <div class="section-header">3. Gemstone & Engraving <span>▲</span></div>
                <div class="grid-options" style="grid-template-columns: repeat(2, 1fr);">
                    <div class="option-card active" onclick="selectOption(this, 'gemstone', 'Diamond')">Diamond</div>
                    <div class="option-card" onclick="selectOption(this, 'gemstone', 'Ruby')">Ruby</div>
                    <div class="option-card" onclick="selectOption(this, 'gemstone', 'Sapphire')">Sapphire</div>
                    <div class="option-card" onclick="selectOption(this, 'gemstone', 'Emerald')">Emerald</div>
                </div>
            </div>
        </div>

        <!-- Right Stage Area / 3D Viewer -->
        <div class="stage-area">
            <div class="page-title">
                <h1>Bespoke Ring Studio</h1>
                <p>Design your custom luxury piece in real-time</p>
            </div>

            <div class="viewport-box">
                <div class="view-360-badge">Interactive 360° View</div>
                <canvas id="ringCanvas"></canvas>
            </div>

            <div class="summary-footer">
                <div class="specs-grid">
                    <div><span>Design</span><strong id="summaryDesign">Classic Plain Band</strong></div>
                    <div><span>Metal</span><strong id="summaryMetal">18K Yellow Gold</strong></div>
                    <div><span>Gemstone</span><strong id="summaryGem">Diamond</strong></div>
                </div>
                <div class="checkout-box">
                    <div class="price-display" id="totalPrice">₹48,000</div>
                    <a href="cart.html" class="submit-btn" onclick="addToCart()">Add to Bag</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function selectOption(element, category, value) {
            // Remove active class from siblings
            const parent = element.parentElement;
            parent.querySelectorAll('.option-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');

            // Update summary text dynamically
            if (category === 'design') {
                document.getElementById('summaryDesign').innerText = value;
            } else if (category === 'metal') {
                document.getElementById('summaryMetal').innerText = value;
            } else if (category === 'gemstone') {
                document.getElementById('summaryGem').innerText = value;
            }
        }

        function addToCart() {
            alert('Customized jewellery added to your shopping bag!');
        }
    </script>
</body>
</html>
