<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHYRIS — Products & Catalog Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Firebase App & Firestore CDN Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --dark-bg: #090909;
            --card-bg: #121212;
            --border-color: #262626;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(12, 12, 12, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
        }

        .admin-logo {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--text-main);
            text-decoration: none;
        }
        .admin-logo span { color: var(--gold); }

        .admin-container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 30px;
            width: 100%;
            flex-grow: 1;
        }

        .section-header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .section-header-box h1 {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .back-btn:hover { background: var(--gold); color: #000; }

        .manager-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
        }

        .form-card, .list-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
        }

        .form-card h3, .list-card h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 20px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        label {
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            display: block;
            margin-top: 15px;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            margin-top: 6px;
            background: var(--dark-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--gold); outline: none; }

        .action-btn {
            width: 100%;
            background: var(--gold);
            color: #000;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
        }
        .action-btn:hover { background: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.3); }

        .product-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .product-list-item:last-child { border-bottom: none; }
        .product-details h4 { font-family: 'Cinzel', serif; font-size: 15px; margin-bottom: 4px; }
        .product-details p { color: var(--gold); font-size: 13px; font-weight: 600; }
        
        .delete-btn {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #f44336;
            color: #f44336;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .delete-btn:hover { background: #f44336; color: #fff; }

        @media(max-width: 900px) {
            .manager-grid { grid-template-columns: 1fr; }
            .admin-header { padding: 15px 20px; }
            .admin-container { padding: 0 15px; }
        }
    </style>
</head>
<body>

    <header class="admin-header">
        <a href="admin.html" class="admin-logo">CHYRIS <span>CATALOG MANAGER</span></a>
        <a href="admin.html" class="back-btn">&larr; Back to Command Center</a>
    </header>

    <div class="admin-container">
        <div class="section-header-box">
            <h1>Inventory & Masterworks</h1>
        </div>

        <div class="manager-grid">
            <!-- Add Product Form -->
            <div class="form-card">
                <h3>Add New Masterpiece</h3>
                <form id="addProductForm">
                    <label>Product Name</label>
                    <input type="text" id="pName" placeholder="e.g. Royal Solitaire Ring" required />

                    <label>Price (₹)</label>
                    <input type="number" id="pPrice" placeholder="e.g. 250000" required />

                    <label>Image URL</label>
                    <input type="url" id="pImgUrl" placeholder="https://example.com/image.jpg" required />

                    <label>Category</label>
                    <select id="pCategory">
                        <option>Rings</option>
                        <option>Necklaces</option>
                        <option>Bangles & Bracelets</option>
                        <option>Earrings</option>
                    </select>

                    <button type="submit" class="action-btn">Upload to Vault</button>
                </form>
            </div>

            <!-- Existing Products List -->
            <div class="list-card">
                <h3>Live Vault Inventory</h3>
                <div id="adminProductList" style="max-height: 500px; overflow-y: auto;">
                    <p style="color: var(--text-muted); text-align: center; padding: 30px;">Loading inventory...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyASH2dCNHazYnqgrCA3u8NNU4ax5To3Xh4",
            authDomain: "chyris-fine-jewelries.firebaseapp.com",
            projectId: "chyris-fine-jewelries",
            storageBucket: "chyris-fine-jewelries.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Load Products into Admin List
        async function loadAdminProducts() {
            const listEl = document.getElementById('adminProductList');
            try {
                const snapshot = await db.collection("products").get();
                listEl.innerHTML = "";

                if (snapshot.empty) {
                    listEl.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 30px;">No products in database.</p>`;
                    return;
                }

                snapshot.forEach((doc) => {
                    const product = doc.data();
                    const item = document.createElement('div');
                    item.className = 'product-list-item';
                    item.innerHTML = `
                        <div class="product-details">
                            <h4>${product.name}</h4>
                            <p>₹${Number(product.price).toLocaleString('en-IN')} &bull; <span style="color:#aaa; font-size:11px;">${product.category || 'General'}</span></p>
                        </div>
                        <button class="delete-btn" onclick="deleteProduct('${doc.id}')">Delete</button>
                    `;
                    listEl.appendChild(item);
                });
            } catch (error) {
                console.error("Error loading inventory:", error);
                listEl.innerHTML = `<p style="color: #f44336; text-align: center; padding: 30px;">Failed to load inventory.</p>`;
            }
        }

        // Add Product Event
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('pName').value;
            const price = Number(document.getElementById('pPrice').value);
            const imageUrl = document.getElementById('pImgUrl').value;
            const category = document.getElementById('pCategory').value;

            try {
                await db.collection("products").add({
                    name, price, imageUrl, category,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Product successfully added to Vault!");
                document.getElementById('addProductForm').reset();
                loadAdminProducts();
            } catch (error) {
                alert("Error adding product: " + error.message);
            }
        });

        // Delete Product
        async function deleteProduct(id) {
            if(confirm("Are you sure you want to remove this masterpiece from the vault?")) {
                try {
                    await db.collection("products").doc(id).delete();
                    loadAdminProducts();
                } catch (error) {
                    alert("Error deleting product: " + error.message);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', loadAdminProducts);
    </script>
</body>
</html>
